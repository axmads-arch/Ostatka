<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shirinlik Ombori</title>
<style>
  :root{
    --bg:#faf7f2; --card:#fff; --ink:#2b2118; --muted:#8a7d6f;
    --accent:#c9752f; --accent2:#7a9a5c; --danger:#c0392b; --border:#e8dfd3;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1712; --card:#26201a; --ink:#f0e9df; --muted:#a99a86; --border:#3a3226; }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  header{padding:14px 14px 6px;text-align:center;}
  header h1{margin:0;font-size:1.25rem;}
  header p{margin:4px 0 0;color:var(--muted);font-size:.8rem;}
  .tabs{display:flex;gap:5px;padding:8px;overflow-x:auto;}
  .tab{flex:1;padding:9px 6px;text-align:center;border-radius:10px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:.78rem;white-space:nowrap;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  main{padding:8px 14px 40px;max-width:640px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
  .name{font-weight:600;overflow-wrap:anywhere;}
  .stock{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .low{color:var(--danger);font-weight:700;}
  input[type=number],input[type=text],input[type=date]{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg);color:var(--ink);font-size:1rem;min-width:0;
  }
  button{padding:8px 12px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:.9rem;cursor:pointer;white-space:nowrap;}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--ink);padding:6px 10px;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .qtybox{display:flex;gap:6px;align-items:center;}
  .qtybox input{width:80px;flex:none;}
  .muted{color:var(--muted);font-size:.8rem;}
  .divider{border-top:1px solid var(--border);margin:10px 0;}
  .logrow{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;border-bottom:1px dashed var(--border);gap:8px;}
  .logrow:last-child{border-bottom:none;}
  .logrow .time{color:var(--muted);font-variant-numeric:tabular-nums;}
  .totals{font-weight:700;margin-top:6px;}
  .empty{color:var(--muted);text-align:center;padding:20px 0;}
  .addform{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .addform input{flex:1;min-width:100px;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;z-index:99;}
  .toast.show{opacity:1;}
  .errmsg{color:var(--danger);font-size:.8rem;margin-top:4px;}
  .full{width:100%;}
  .pill{display:inline-block;background:rgba(201,117,47,.15);color:var(--accent);border-radius:20px;padding:2px 10px;font-size:.75rem;font-weight:600;}
  .datebar{display:flex;gap:8px;align-items:center;margin-bottom:4px;}
  .datebar input{flex:1;}
  .top1{background:rgba(122,154,92,.15);border-radius:10px;padding:8px 10px;margin-bottom:6px;}
  .badge{background:var(--accent2);color:#fff;border-radius:8px;padding:1px 7px;font-size:.7rem;margin-right:6px;}
  .sheet{width:100%;border-collapse:collapse;font-size:.82rem;}
  .sheet th{position:sticky;top:0;background:var(--card);text-align:center;padding:6px 3px;border-bottom:2px solid var(--border);font-size:.72rem;color:var(--muted);z-index:1;}
  .sheet th:first-child{text-align:left;}
  .sheet td{padding:4px 3px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .sheet .catrow td{background:rgba(201,117,47,.13);font-weight:700;padding:6px 4px;font-size:.8rem;}
  .sheet .menuname{max-width:110px;overflow-wrap:anywhere;line-height:1.15;}
  .sheet td.num{text-align:center;width:64px;}
  .cell-input{width:56px;padding:5px 2px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:.85rem;text-align:center;-moz-appearance:textfield;}
  .cell-input.low-cell{border-color:var(--danger);color:var(--danger);font-weight:700;}
  .cell-input::-webkit-outer-spin-button,.cell-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .sheet-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .saved-flash{animation:flashok .6s ease;}
  @keyframes flashok{0%{background:rgba(122,154,92,.35);}100%{background:transparent;}}
</style>
</head>
<body>
<header>
  <h1>🍰 Shirinlik Ombori</h1>
  <p id="dateLabel"></p>
</header>
<div class="tabs">
  <div class="tab" data-tab="tsex">🏭 Tsex</div>
  <div class="tab" data-tab="tarix">📅 Kunlik</div>
  <div class="tab" data-tab="kassa">🧾 Ostatka</div>
  <div class="tab" data-tab="idishlar">🍽 Idishlar</div>
  <div class="tab" data-tab="boss">📊 Statistika</div>
</div>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'shirinlik_ombor_v2';
const LOW_STOCK = 5;
let state = loadState();
let activeTab = 'tsex';
let tarixDate = todayStr();
let submitting = false;

// ---------- Holatni yuklash / migratsiya ----------
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return normalize(JSON.parse(raw));
  }catch(e){ console.error('State o\'qishda xato', e); }
  // eski versiyadan (v1) migratsiya qilishga urinamiz
  try{
    const oldRaw = localStorage.getItem('shirinlik_ombor_v1');
    if(oldRaw){
      const old = JSON.parse(oldRaw);
      return migrateFromV1(old);
    }
  }catch(e){ /* ignore */ }
  return { products:{}, batches:[], shifts:{}, utensils:{}, utensilChecks:{} };
}

function normalize(s){
  s.products = s.products || {};
  s.batches = s.batches || [];
  s.shifts = s.shifts || {};
  s.utensils = s.utensils || {};
  s.utensilChecks = s.utensilChecks || {};
  return s;
}

function migrateFromV1(old){
  const products = {};
  Object.entries(old.products||{}).forEach(([id,p])=>{
    products[id] = {name:p.name, category:p.category||'Boshqalar', price:p.price||0, standart:p.standart||0, stock:p.stock||0, orderQty:p.orderQty||0};
  });
  const shifts = {};
  Object.entries(old.history||{}).forEach(([date,h])=>{
    shifts[date] = {
      entries: (h.records||[]).map(r=>({
        productId: null, productName: r.product, incoming: r.incoming||0,
        startStock: r.startStock||0, endCounted: r.endCounted, sold: r.sold||0, revenue: r.revenue||0
      })),
      total: h.total||0, closedAt: h.updatedAt||Date.now()
    };
  });
  return { products, batches:[], shifts, utensils:{}, utensilChecks:{} };
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    console.error('Saqlashda xato', e);
    showToast('Xotiraga saqlab bo\'lmadi (joy yetmadimi?)');
    return false;
  }
}

// ---------- Yordamchi funksiyalar ----------
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function nowTime(){
  const d = new Date();
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('uz-UZ', {day:'numeric', month:'long', year:'numeric'});
}
document.getElementById('dateLabel').textContent = fmtDate(todayStr());

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function slug(name){
  const base = String(name).toLowerCase()
    .replace(/[^a-z0-9\u0400-\u04FF]+/gi,'-')
    .replace(/^-+|-+$/g,'');
  return (base || 'mahsulot') + '-' + Date.now().toString(36);
}

function num(val, {min=null, allowFloat=false} = {}){
  const n = allowFloat ? parseFloat(val) : parseInt(val, 10);
  if(isNaN(n) || !isFinite(n)) return null;
  if(min !== null && n < min) return null;
  return n;
}

function fmt(n){
  const v = Number(n);
  if(isNaN(v)) return '0';
  return Math.round(v).toLocaleString('uz-UZ');
}

// ---------- Tab almashish ----------
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{ activeTab = t.dataset.tab; render(); });
});

// ---------- Mahsulot boshqaruvi ----------
function addProduct(){
  const errEl = document.getElementById('addProductError');
  if(errEl) errEl.textContent = '';
  const nameEl = document.getElementById('newName');
  const catEl = document.getElementById('newCategory');
  const priceEl = document.getElementById('newPrice');
  const standartEl = document.getElementById('newStandart');
  const name = nameEl.value.trim();
  const category = (catEl && catEl.value.trim()) || 'Boshqalar';
  let price = 0;
  if(priceEl.value.trim() !== ''){
    const parsed = num(priceEl.value, {min:0, allowFloat:true});
    if(parsed === null){
      if(errEl) errEl.textContent = 'Narx manfiy bo\'lmasligi kerak';
      priceEl.focus(); return;
    }
    price = parsed;
  }
  let standart = 0;
  if(standartEl && standartEl.value.trim() !== ''){
    const parsedS = num(standartEl.value, {min:0});
    if(parsedS === null){ if(errEl) errEl.textContent = 'Standart son manfiy bo\'lmasligi kerak'; standartEl.focus(); return; }
    standart = parsedS;
  }
  if(!name){
    if(errEl) errEl.textContent = 'Mahsulot nomini kiriting';
    nameEl.focus(); return;
  }
  const exists = Object.values(state.products).some(p => (p.name||'').trim().toLowerCase() === name.toLowerCase());
  if(exists){ if(errEl) errEl.textContent = 'Bu mahsulot allaqachon mavjud'; return; }
  const id = slug(name);
  state.products[id] = {name, category, price, standart, stock:0, orderQty:0};
  if(saveState()){
    nameEl.value=''; if(catEl) catEl.value=''; priceEl.value=''; if(standartEl) standartEl.value='';
    showToast('Qo\'shildi: ' + name);
    render();
  }
}

function isLow(p){
  const stock = p.stock||0;
  if(p.standart && p.standart>0) return stock < p.standart;
  return stock <= LOW_STOCK;
}

function groupByCategory(ids, products){
  const groups = {};
  const order = [];
  ids.forEach(id=>{
    const cat = products[id].category || 'Boshqalar';
    if(!groups[cat]){ groups[cat]=[]; order.push(cat); }
    groups[cat].push(id);
  });
  order.forEach(cat=> groups[cat].sort((a,b)=>(products[a].name||'').localeCompare(products[b].name||'', 'uz')));
  return order.map(cat=>({cat, ids:groups[cat]}));
}

// ---------- Jadval katakchalarini saqlash (Ostatka sahifasi) ----------
function updateOstatka(id, rawVal){
  const p = state.products[id];
  if(!p) return;
  const counted = num(rawVal, {min:0});
  if(counted === null) return;
  const date = todayStr();
  const incoming = batchesForDate(date).flatMap(batchItems).filter(it=>it.productId===id).reduce((s,it)=>s+it.qty,0);
  const stockBefore = p.stock || 0;
  const sold = Math.max(0, stockBefore - counted);
  const revenue = sold * (p.price || 0);
  const entry = {productId:id, productName:p.name, incoming, startStock: stockBefore-incoming, endCounted:counted, sold, revenue};
  const shift = state.shifts[date] || {entries:[], total:0};
  shift.entries = (shift.entries||[]).filter(e => e.productId !== id).concat([entry]);
  shift.total = shift.entries.reduce((s,e)=>s+(e.revenue||0),0);
  shift.closedAt = Date.now();
  state.shifts[date] = shift;
  p.stock = counted;
  saveState();
}

function updateStandart(id, rawVal){
  const p = state.products[id];
  if(!p) return;
  const val = rawVal.trim()==='' ? 0 : num(rawVal, {min:0});
  if(val === null) return;
  p.standart = val;
  saveState();
}

function updateZakaz(id, rawVal){
  const p = state.products[id];
  if(!p) return;
  const val = rawVal.trim()==='' ? 0 : num(rawVal, {min:0});
  if(val === null) return;
  p.orderQty = val;
  saveState();
}

function deleteProduct(id){
  const p = state.products[id];
  if(!p) return;
  if(!confirm('O\'chirilsinmi: ' + p.name + '? (Tarix saqlanib qoladi)')) return;
  delete state.products[id];
  if(saveState()){ showToast('O\'chirildi'); render(); }
}

// ---------- Tozalash ----------
function clearDate(date){
  if(!confirm(fmtDate(date) + ' kuni uchun barcha partiya va smena yozuvlari o\'chirilsinmi?')) return;
  state.batches = state.batches.filter(b => b.date !== date);
  delete state.shifts[date];
  if(saveState()){ showToast('Tozalandi: ' + fmtDate(date)); render(); }
}

function resetHistory(){
  if(!confirm('Barcha partiyalar va kunlik hisobotlar (tarix) o\'chirilsinmi? Mahsulotlar ro\'yxati va joriy qoldiqlar saqlanib qoladi.')) return;
  if(!confirm('Bu amalni orqaga qaytarib bo\'lmaydi. Davom etilsinmi?')) return;
  state.batches = [];
  state.shifts = {};
  if(saveState()){ showToast('Tarix tozalandi'); render(); }
}

function resetEverything(){
  if(!confirm('DIQQAT: barcha mahsulotlar, qoldiqlar va tarix butunlay o\'chiriladi. Davom etilsinmi?')) return;
  if(!confirm('Haqiqatan ham hammasini o\'chirmoqchimisiz? Bu amalni qaytarib bo\'lmaydi!')) return;
  state = { products:{}, batches:[], shifts:{} };
  if(saveState()){ showToast('Hammasi tozalandi'); render(); }
}

// ---------- Tsex: partiya qo'shish (log bilan) ----------
// bitta "partiya" — bir mashinada bir vaqtda kelgan bir nechta mahsulot, hammasi bir vaqt bilan
function submitPartiya(){
  const ids = Object.keys(state.products);
  const items = [];
  for(const id of ids){
    const input = document.getElementById('batch-'+id);
    if(!input) continue;
    const raw = input.value.trim();
    if(raw === '') continue;
    const qty = num(raw, {min:1});
    if(qty === null){ showToast((state.products[id].name||'') + ' uchun miqdor noto\'g\'ri'); return; }
    items.push({productId:id, productName: state.products[id].name, qty});
  }
  if(items.length === 0){ showToast('Kamida bitta mahsulot miqdorini kiriting'); return; }

  const date = todayStr();
  const time = nowTime();
  state.batches.push({
    id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    date, time, ts: Date.now(), items
  });
  items.forEach(it=>{
    const p = state.products[it.productId];
    if(!p) return;
    p.stock = (p.stock||0) + it.qty;
    if(p.orderQty) p.orderQty = Math.max(0, p.orderQty - it.qty);
  });
  if(saveState()){
    ids.forEach(id=>{ const inp = document.getElementById('batch-'+id); if(inp) inp.value=''; });
    showToast('Partiya saqlandi: ' + items.length + ' ta mahsulot (' + time + ')');
    render();
  }
}

// har bir partiyaning ichidagi mahsulotlarini olish (eski, bitta-mahsulotli yozuvlar bilan ham mos)
function batchItems(b){
  return b.items || [{productId:b.productId, productName:b.productName, qty:b.qty}];
}

function batchesForDate(date){
  return state.batches.filter(b => b.date === date).sort((a,b)=> a.ts - b.ts);
}


// ---------- Idishlar (haftalik hisob) ----------
function addUtensil(){
  const errEl = document.getElementById('addUtensilError');
  if(errEl) errEl.textContent = '';
  const nameEl = document.getElementById('newUtensilName');
  const priceEl = document.getElementById('newUtensilPrice');
  const name = nameEl.value.trim();
  let price = 0;
  if(priceEl.value.trim() !== ''){
    const parsed = num(priceEl.value, {min:0, allowFloat:true});
    if(parsed === null){ if(errEl) errEl.textContent = 'Narx manfiy bo\'lmasligi kerak'; priceEl.focus(); return; }
    price = parsed;
  }
  if(!name){ if(errEl) errEl.textContent = 'Nomini kiriting'; nameEl.focus(); return; }
  const exists = Object.values(state.utensils).some(u => (u.name||'').trim().toLowerCase() === name.toLowerCase());
  if(exists){ if(errEl) errEl.textContent = 'Bu allaqachon mavjud'; return; }
  const startEl = document.getElementById('newUtensilCount');
  const start = num(startEl.value, {min:0}) || 0;
  const id = slug(name);
  state.utensils[id] = {name, price, count:start};
  if(saveState()){
    nameEl.value=''; priceEl.value=''; startEl.value='';
    showToast('Qo\'shildi: ' + name);
    render();
  }
}

function deleteUtensil(id){
  const u = state.utensils[id];
  if(!u) return;
  if(!confirm('O\'chirilsinmi: ' + u.name + '? (Tarix saqlanib qoladi)')) return;
  delete state.utensils[id];
  if(saveState()){ showToast('O\'chirildi'); render(); }
}

function submitUtensilCheck(){
  const ids = Object.keys(state.utensils);
  const entries = [];
  for(const id of ids){
    const countEl = document.getElementById('ucount-'+id);
    if(!countEl) continue;
    const raw = countEl.value.trim();
    if(raw === '') continue;
    const counted = num(raw, {min:0});
    if(counted === null){ showToast((state.utensils[id].name||'') + ' uchun son noto\'g\'ri'); return; }
    const addedEl = document.getElementById('uadded-'+id);
    const added = addedEl && addedEl.value.trim() !== '' ? (num(addedEl.value, {min:0})||0) : 0;
    entries.push({id, counted, added});
  }
  if(entries.length === 0){ showToast('Kamida bitta narsa uchun sonini kiriting'); return; }

  const date = todayStr();
  const newEntries = [];
  let totalMissing = 0, totalCost = 0;
  for(const {id, counted, added} of entries){
    const u = state.utensils[id];
    if(!u) continue;
    const before = u.count || 0;
    const expected = before + added;
    const missing = Math.max(0, expected - counted);
    const cost = missing * (u.price || 0);
    totalMissing += missing;
    totalCost += cost;
    newEntries.push({itemId:id, name:u.name, before, added, counted, missing, cost});
    u.count = counted;
  }
  if(newEntries.length === 0){ showToast('Hech narsa saqlanmadi'); return; }

  state.utensilChecks[date] = { entries: newEntries, totalMissing, totalCost, savedAt: Date.now() };
  if(saveState()){
    showToast('Haftalik hisobot saqlandi ✅');
    document.querySelectorAll('input[id^="ucount-"], input[id^="uadded-"]').forEach(i=>i.value='');
    render();
  }
}



// ---------- Top mahsulotlar (barcha vaqt) ----------
function allTimeTop(limit=5){
  const agg = {};
  Object.values(state.shifts).forEach(sh=>{
    (sh.entries||[]).forEach(e=>{
      const key = e.productName;
      if(!agg[key]) agg[key] = {name:key, sold:0, revenue:0};
      agg[key].sold += e.sold||0;
      agg[key].revenue += e.revenue||0;
    });
  });
  return Object.values(agg).sort((a,b)=>b.sold-a.sold).slice(0,limit);
}

function topForDate(date){
  const sh = state.shifts[date];
  if(!sh || !sh.entries || sh.entries.length===0) return [];
  return [...sh.entries].sort((a,b)=>(b.sold||0)-(a.sold||0));
}

// ---------- Oxirgi N kunlik xulosa ----------
function lastNDaysSummary(n=7){
  const days = [];
  for(let i=n-1; i>=0; i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const date = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const sh = state.shifts[date];
    const sold = sh ? (sh.entries||[]).reduce((s,e)=>s+(e.sold||0),0) : 0;
    const total = sh ? (sh.total||0) : 0;
    days.push({date, sold, total, closed: !!sh});
  }
  return days;
}

// ---------- CSV eksport ----------
function exportCsv(){
  const dates = Object.keys(state.shifts).sort();
  if(dates.length === 0){ showToast('Hali hisobot yo\'q'); return; }
  const rows = [['Sana','Mahsulot','Kelgan','Sotilgan','Narxi','Summasi']];
  dates.forEach(date=>{
    const sh = state.shifts[date];
    (sh.entries||[]).forEach(e=>{
      const price = e.sold>0 ? Math.round((e.revenue||0)/e.sold) : '';
      rows.push([date, e.productName, e.incoming||0, e.sold||0, price, e.revenue||0]);
    });
  });
  const csv = rows.map(r=>r.map(v=>{
    const s = String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'shirinlik-hisobot-' + todayStr() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Hisobot yuklab olindi');
}

// ---------- Voqealar (delegatsiya) ----------
document.getElementById('main').addEventListener('click', (e)=>{
  const submitPartiyaBtn = e.target.closest('[data-action="submit-partiya"]');
  if(submitPartiyaBtn){ submitPartiya(); return; }
  const delBtn = e.target.closest('[data-action="delete-product"]');
  if(delBtn){ deleteProduct(delBtn.dataset.id); return; }
  const addProdBtn = e.target.closest('[data-action="add-product"]');
  if(addProdBtn){ addProduct(); return; }
  const clearDateBtn = e.target.closest('[data-action="clear-date"]');
  if(clearDateBtn){ clearDate(clearDateBtn.dataset.date); return; }
  const resetHistBtn = e.target.closest('[data-action="reset-history"]');
  if(resetHistBtn){ resetHistory(); return; }
  const resetAllBtn = e.target.closest('[data-action="reset-all"]');
  if(resetAllBtn){ resetEverything(); return; }
  const exportBtn = e.target.closest('[data-action="export-csv"]');
  if(exportBtn){ exportCsv(); return; }
  const addUtBtn = e.target.closest('[data-action="add-utensil"]');
  if(addUtBtn){ addUtensil(); return; }
  const delUtBtn = e.target.closest('[data-action="delete-utensil"]');
  if(delUtBtn){ deleteUtensil(delUtBtn.dataset.id); return; }
  const submitUtBtn = e.target.closest('[data-action="submit-utensil-check"]');
  if(submitUtBtn){ submitUtensilCheck(); return; }
});
document.getElementById('main').addEventListener('keydown', (e)=>{
  if(e.target.matches('input[id^="batch-"]') && e.key==='Enter'){ submitPartiya(); }
  if((e.target.id === 'newName' || e.target.id === 'newPrice') && e.key==='Enter'){ addProduct(); }
  // jadval katakchalarida Enter bosilsa, keyingi qatorga o'tkazadi va saqlaydi
  if(e.key === 'Enter' && e.target.classList.contains('cell-input')){
    e.target.blur();
  }
});
document.getElementById('main').addEventListener('change', (e)=>{
  if(e.target.id === 'tarixDateInput'){
    tarixDate = e.target.value || todayStr();
    render();
    return;
  }
  const t = e.target;
  if(!t.classList || !t.classList.contains('cell-input')) return;
  const id = t.dataset.id;
  if(!id) return;
  const flash = ()=>{
    const cell = t.closest('td');
    if(cell){ cell.classList.remove('saved-flash'); void cell.offsetWidth; cell.classList.add('saved-flash'); }
  };
  if(t.classList.contains('ostatka-input')){
    updateOstatka(id, t.value);
    render();
  }else if(t.classList.contains('standart-input')){
    updateStandart(id, t.value);
    flash();
  }else if(t.classList.contains('zakaz-input')){
    updateZakaz(id, t.value);
    flash();
  }
});

// ---------- Render ----------
function render(){
  const main = document.getElementById('main');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===activeTab));
  const products = state.products;
  const ids = Object.keys(products).sort((a,b)=>
    (products[a].name||'').localeCompare(products[b].name||'', 'uz'));

  if(activeTab === 'tsex'){
    const today = todayStr();
    const todaysBatches = batchesForDate(today);
    const byProductToday = {};
    todaysBatches.forEach(b=>{
      batchItems(b).forEach(it=>{
        if(!byProductToday[it.productId]) byProductToday[it.productId] = {qty:0, count:0};
        byProductToday[it.productId].qty += it.qty;
        byProductToday[it.productId].count += 1;
      });
    });
    const totalToday = todaysBatches.reduce((s,b)=>s+batchItems(b).reduce((s2,it)=>s2+it.qty,0),0);

    const ordered = ids.filter(id => (products[id].orderQty||0) > 0);

    main.innerHTML = `
      <div class="card"><div class="muted">Bir mashinada bir vaqtda kelgan hamma mahsulot miqdorini pastdagi maydonlarga yozing, so'ng bittagina tugma bilan saqlang — hammasi bitta partiya, bir vaqt bilan yoziladi.</div></div>
      ${ordered.length>0 ? `<div class="card" style="border-color:var(--accent)">
        <div class="name">📦 Zakaz qilingan mahsulotlar</div>
        <div class="muted" style="margin-bottom:6px">Boshliq/kassa so'ragan miqdorlar — shularni yuboring</div>
        <div class="divider"></div>
        ${ordered.map(id=>`<div class="logrow"><span>${escapeHtml(products[id].name)}</span><span class="pill">${products[id].orderQty} ta kerak</span></div>`).join('')}
      </div>` : ''}
      ${ids.length===0 ? '<div class="empty">Hali mahsulot yo\'q.<br>Boshliq bo\'limidan qo\'shing.</div>' : ''}
      ${ids.map(id=>{
        const p = products[id];
        const stock = p.stock||0;
        const low = isLow(p);
        const t = byProductToday[id];
        const order = p.orderQty||0;
        return `<div class="card" style="margin-bottom:8px">
          <div class="row">
            <div class="name">${escapeHtml(p.name)} ${order>0?'<span class="badge">📦 '+order+' ta zakaz</span>':''}</div>
            <div class="stock ${low?'low':''}">${stock} ta ${low?'⚠️':''}</div>
          </div>
          <input type="number" id="batch-${id}" placeholder="shu partiyada nechta keldi" min="1" inputmode="numeric">
          ${t ? `<div class="muted" style="margin-top:6px">Bugun jami yuborilgan: <b>${t.qty} ta</b></div>` : ''}
        </div>`;
      }).join('')}
      ${ids.length>0 ? `<button class="full" data-action="submit-partiya">✅ Partiyani saqlash</button>` : ''}

      ${todaysBatches.length>0 ? `<div class="card" style="margin-top:12px">
        <div class="row"><div class="name">Bugungi partiyalar jurnali</div><span class="pill">${todaysBatches.length} marta · ${totalToday} ta</span></div>
        <div class="divider"></div>
        ${todaysBatches.slice().reverse().map(b=>{
          const its = batchItems(b);
          const sum = its.reduce((s,it)=>s+it.qty,0);
          return `<div style="margin-bottom:10px">
            <div class="row" style="margin-bottom:2px"><span class="time"><b>${b.time}</b></span><span class="muted">${its.length} ta mahsulot, jami ${sum} ta</span></div>
            ${its.map(it=>`<div class="logrow"><span>${escapeHtml(it.productName)}</span><span>+${it.qty} ta</span></div>`).join('')}
          </div>`;
        }).join('')}
      </div>` : ''}
    `;
    return;
  }

  if(activeTab === 'tarix'){
    const dayBatches = batchesForDate(tarixDate);
    const totalIncoming = dayBatches.reduce((s,b)=>s+batchItems(b).reduce((s2,it)=>s2+it.qty,0),0);
    const shift = state.shifts[tarixDate];
    // jadval uchun: har bir mahsulot — kelgan, qoldi, sotildi, summasi; ko'p sotilgandan kamiga
    const tableRows = shift ? [...shift.entries].sort((a,b)=>(b.sold||0)-(a.sold||0)) : [];

    main.innerHTML = `
      <div class="card">
        <div class="datebar">
          <label class="muted" style="white-space:nowrap">Sana:</label>
          <input type="date" id="tarixDateInput" value="${tarixDate}">
        </div>
        <div class="row" style="margin-top:6px;margin-bottom:0">
          <div class="muted">${fmtDate(tarixDate)}</div>
          ${(dayBatches.length>0 || shift) ? `<button class="ghost" data-action="clear-date" data-date="${tarixDate}">🗑 Shu kunni tozalash</button>` : ''}
        </div>
      </div>

      <div class="card">
        <div class="row"><div class="name">🚚 Kelgan partiyalar</div><span class="pill">${dayBatches.length} marta · ${totalIncoming} ta</span></div>
        <div class="muted" style="margin:2px 0 8px">Bir mashinada bir vaqtda kelgan mahsulotlar — bitta partiya</div>
        ${dayBatches.length===0 ? '<div class="empty">Bu kunda partiya kelmagan</div>' : dayBatches.map(b=>{
          const its = batchItems(b);
          const sum = its.reduce((s,it)=>s+it.qty,0);
          return `<div class="card" style="margin-bottom:8px;background:var(--bg)">
            <div class="row" style="margin-bottom:4px"><span><b>🕐 ${b.time}</b></span><span class="muted">${its.length} ta mahsulot, jami ${sum} ta</span></div>
            ${its.map(it=>`<div class="logrow"><span>${escapeHtml(it.productName)}</span><span>+${it.qty} ta</span></div>`).join('')}
          </div>`;
        }).join('')}
      </div>

      <div class="card sheet-wrap" style="${tableRows.length? 'padding:0':''}">
        ${tableRows.length===0 ? `<div class="name" style="padding:${tableRows.length?0:'0'}">Kunlik natija (smena)</div><div class="empty">Bu kun uchun hali smena yopilmagan</div>` : `
        <table class="sheet">
          <thead><tr><th>Mahsulot</th><th>Kelgan</th><th>Qoldi</th><th>Sotildi</th><th>Summasi</th></tr></thead>
          <tbody>
            ${tableRows.map((e,i)=>`<tr${i===0?' style="background:rgba(122,154,92,.15)"':''}>
              <td class="menuname">${i===0?'🏆 ':''}${escapeHtml(e.productName)}</td>
              <td class="num">${e.incoming}</td>
              <td class="num">${e.endCounted}</td>
              <td class="num"><b>${e.sold}</b></td>
              <td class="num">${fmt(e.revenue)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
        <div class="totals" style="padding:10px 14px">Jami: ${fmt(shift.total||0)} so'm</div>
        `}
      </div>
    `;
    return;
  }

  if(activeTab === 'kassa'){
    const groups = groupByCategory(ids, products);
    main.innerHTML = `
      <div class="card"><div class="muted">Har bir katakchaga to'g'ridan-to'g'ri yozing — chiqib ketishingiz bilan (yoki Enter) avtomatik saqlanadi. <b>Ostatka</b> — hozirgi qoldiq, <b>Standart</b> — norma, <b>Zakaz</b> — tsexga qancha kerakligi.</div></div>
      ${ids.length===0 ? '<div class="empty">Mahsulot yo\'q. Statistika bo\'limidan qo\'shing.</div>' : `
      <div class="card sheet-wrap" style="padding:0">
        <table class="sheet">
          <thead><tr><th>Menu</th><th>Ostatka</th><th>Standart</th><th>Zakaz</th></tr></thead>
          <tbody>
            ${groups.map(g=>`
              <tr class="catrow"><td colspan="4">${escapeHtml(g.cat)}</td></tr>
              ${g.ids.map(id=>{
                const p = products[id];
                const low = isLow(p);
                return `<tr>
                  <td class="menuname">${escapeHtml(p.name)}</td>
                  <td class="num"><input type="number" inputmode="numeric" class="cell-input ostatka-input ${low?'low-cell':''}" data-id="${id}" value="${p.stock||0}"></td>
                  <td class="num"><input type="number" inputmode="numeric" class="cell-input standart-input" data-id="${id}" value="${p.standart||0}"></td>
                  <td class="num"><input type="number" inputmode="numeric" class="cell-input zakaz-input" data-id="${id}" value="${p.orderQty||0}"></td>
                </tr>`;
              }).join('')}
            `).join('')}
          </tbody>
        </table>
      </div>`}
    `;
    return;
  }

  if(activeTab === 'idishlar'){
    const uids = Object.keys(state.utensils).sort((a,b)=>
      (state.utensils[a].name||'').localeCompare(state.utensils[b].name||'', 'uz'));
    const checkDates = Object.keys(state.utensilChecks).sort().reverse();

    main.innerHTML = `
      <div class="card">
        <div class="name">Yangi idish/asbob qo'shish</div>
        <div class="addform">
          <input type="text" id="newUtensilName" placeholder="Nomi (masalan: Choy qoshiq)">
          <input type="number" id="newUtensilPrice" placeholder="Narxi (ixtiyoriy)" min="0">
          <input type="number" id="newUtensilCount" placeholder="Boshlang'ich soni" min="0">
          <button data-action="add-utensil">＋ Qo'shish</button>
        </div>
        <div class="errmsg" id="addUtensilError"></div>
      </div>

      <div class="card">
        <div class="name">Joriy hisob</div>
        <div class="divider"></div>
        ${uids.length===0 ? '<div class="empty">Hali idish/asbob qo\'shilmagan</div>' : uids.map(id=>{
          const u = state.utensils[id];
          return `<div class="row">
            <div class="name">${escapeHtml(u.name)}</div>
            <div class="qtybox">
              <span class="stock">${u.count||0} ta</span>
              <button class="ghost" data-action="delete-utensil" data-id="${id}">🗑</button>
            </div>
          </div>`;
        }).join('')}
      </div>

      <div class="card">
        <div class="name">📋 Haftalik sanoq</div>
        <div class="muted" style="margin-bottom:8px">Har juma (yoki xohlagan kuningizda) haqiqiy sonini kiriting. Agar shu hafta yangi narsa sotib olingan bo'lsa, "yangi qo'shilgan" ustuniga yozing — shunda kam chiqqan soni to'g'ri hisoblanadi.</div>
        ${uids.length===0 ? '<div class="empty">Avval yuqoridan idish/asbob qo\'shing</div>' : uids.map(id=>{
          const u = state.utensils[id];
          return `<div class="card" style="margin-bottom:8px">
            <div class="row"><div class="name">${escapeHtml(u.name)}</div><div class="muted">Oldingi: ${u.count||0} ta</div></div>
            <div class="qtybox" style="flex-wrap:wrap">
              <input type="number" id="uadded-${id}" placeholder="yangi qo'shilgan" min="0" inputmode="numeric" style="width:auto;flex:1">
              <input type="number" id="ucount-${id}" placeholder="hozirgi soni" min="0" inputmode="numeric" style="width:auto;flex:1">
            </div>
          </div>`;
        }).join('')}
        ${uids.length>0 ? `<button class="full" data-action="submit-utensil-check">✅ Haftalik hisobotni saqlash</button>` : ''}
      </div>

      <div class="card">
        <div class="name">Hisobotlar tarixi</div>
        <div class="divider"></div>
        ${checkDates.length===0 ? '<div class="empty">Hali hisobot yo\'q</div>' : checkDates.map(d=>{
          const c = state.utensilChecks[d];
          return `<div style="margin-bottom:14px">
            <div style="font-weight:600">${fmtDate(d)}</div>
            ${c.entries.filter(e=>e.missing>0 || e.added>0).map(e=>
              `<div class="logrow"><span>${escapeHtml(e.name)}${e.added>0?' (+'+e.added+' yangi)':''}</span><span>${e.missing>0?`<span class="low">kam: ${e.missing} ta</span>`:'to\'liq'}</span></div>`
            ).join('') || '<div class="muted">Kamchilik yo\'q ✅</div>'}
            <div class="totals">Jami kam chiqqan: ${c.totalMissing} ta${c.totalCost>0?` · ${fmt(c.totalCost)} so'm`:''}</div>
          </div>`;
        }).join('')}
      </div>
    `;
    return;
  }

  if(activeTab === 'boss'){
    const top = allTimeTop(5);
    const week = lastNDaysSummary(7);
    const weekTotal = week.reduce((s,d)=>s+d.total,0);
    const weekSold = week.reduce((s,d)=>s+d.sold,0);
    const groups = groupByCategory(ids, products);
    main.innerHTML = `
      <div class="card">
        <div class="name">Yangi mahsulot qo'shish</div>
        <div class="addform">
          <input type="text" id="newName" placeholder="Nomi (masalan: Napoleon)">
          <input type="text" id="newCategory" placeholder="Kategoriya (masalan: San-sevastian)">
          <input type="number" id="newPrice" placeholder="Narxi (ixtiyoriy)" min="0">
          <input type="number" id="newStandart" placeholder="Standart (ixtiyoriy)" min="0">
          <button id="addProductBtn" data-action="add-product">＋ Qo'shish</button>
        </div>
        <div class="errmsg" id="addProductError"></div>
      </div>

      <div class="card">
        <div class="name">Joriy qoldiqlar</div>
        <div class="muted" style="margin-bottom:6px">Kam qolganlariga (⚠️) tsex ko'proq yuborishi kerak. Kategoriya va standart sonini Ostatka sahifasidan ham tahrirlash mumkin.</div>
        <div class="divider"></div>
        ${ids.length===0 ? '<div class="empty">Mahsulot yo\'q</div>' : groups.map(g=>`
          <div class="muted" style="margin:8px 0 2px;font-weight:700">${escapeHtml(g.cat)}</div>
          ${g.ids.map(id=>{
            const p = products[id];
            const low = isLow(p);
            return `<div class="row">
              <div class="name">${escapeHtml(p.name)}${p.standart>0?` <span class="muted">(norma: ${p.standart})</span>`:''}</div>
              <div class="qtybox">
                <span class="stock ${low?'low':''}">${p.stock||0} ta</span>
                <button class="ghost" data-action="delete-product" data-id="${id}">🗑</button>
              </div>
            </div>`;
          }).join('')}
        `).join('')}
      </div>

      <div class="card">
        <div class="row"><div class="name">📈 Oxirgi 7 kun</div><span class="pill">${fmt(weekTotal)} so'm</span></div>
        <div class="divider"></div>
        ${week.map(d=>{
          const isToday = d.date === todayStr();
          return `<div class="logrow">
            <span>${isToday?'<b>Bugun</b>':fmtDate(d.date).replace(/ \d{4}$/,'')}</span>
            <span>${d.closed ? `${d.sold} ta — <b>${fmt(d.total)} so'm</b>` : '<span class="muted">yopilmagan</span>'}</span>
          </div>`;
        }).join('')}
        <div class="totals">Jami sotilgan: ${weekSold} ta</div>
      </div>

      <div class="card">
        <div class="name">🏆 Barcha vaqt bo'yicha top mahsulotlar</div>
        <div class="divider"></div>
        ${top.length===0 ? '<div class="empty">Hali smena yopilmagan</div>' : top.map((t,i)=>
          `<div class="logrow"><span>${i+1}. ${escapeHtml(t.name)}</span><span><b>${t.sold} ta</b> · ${fmt(t.revenue)} so'm</span></div>`
        ).join('')}
      </div>

      <div class="card">
        <div class="name">📤 Hisobotni yuklab olish</div>
        <div class="muted" style="margin-bottom:8px">Barcha kunlik hisobotlarni Excel'da ochiladigan faylga (CSV) yuklab oling</div>
        <button class="full secondary" data-action="export-csv">⬇️ CSV yuklab olish</button>
      </div>

      <div class="card">
        <div class="name">Ma'lumotlarni tozalash</div>
        <div class="muted" style="margin-bottom:8px">Test uchun kiritilgan noto'g'ri raqamlarni shu yerdan tozalashingiz mumkin</div>
        <div class="addform">
          <button class="ghost full" data-action="reset-history">🗑 Faqat tarixni tozalash</button>
        </div>
        <div class="muted" style="margin:6px 0">Mahsulotlar va joriy qoldiqlar saqlanib qoladi, faqat partiyalar jurnali va kunlik hisobotlar o'chadi.</div>
        <div class="divider"></div>
        <div class="addform">
          <button class="full" style="background:var(--danger)" data-action="reset-all">⚠️ Hammasini o'chirish</button>
        </div>
        <div class="muted" style="margin-top:6px">Mahsulotlar, qoldiqlar va tarix — barchasi butunlay o'chadi.</div>
      </div>
    `;
    return;
  }
}

render();
</script>
</body>
</html>
